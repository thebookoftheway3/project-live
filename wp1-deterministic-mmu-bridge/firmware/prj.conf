# SPDX-License-Identifier: AGPL-3.0-only
CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2
# TX power belongs to cpunet: see sysbuild/ipc_radio.conf (+3 dBm, not +8).
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MAIN_STACK_SIZE=4096
# No Wi-Fi/modem driver, destination, connection attempt or delivery transport.
# NCS crypto backend is required to link native TLS sockets.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_TLS_LIBRARY=y
CONFIG_MBEDTLS_HEAP_SIZE=81920
# Bounded TLS 1.2 ECDHE/ECDSA + AES-GCM capability; no credentials provisioned.
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_MBEDTLS_SSL_SRV_C=n
CONFIG_NET_SOCKETS_ENABLE_DTLS=n
