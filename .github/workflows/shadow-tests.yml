name: Shadow simulation tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked verification tools (wheels only)
        id: install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci.txt
      - name: Python static analysis
        id: lint
        run: ruff check project_live tests tools
      - name: Python formatting
        id: format
        run: ruff format --check project_live tests tools
      - name: GitHub Actions security (offline, no token)
        id: actions
        run: zizmor --offline --no-progress --strict-collection --persona auditor .github
      - name: Documentation links and template syntax
        id: docs
        run: |
          rumdl check .
          python tools/check_templates.py
      - name: Tests, architecture and traceability
        id: tests
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Synthetic CLI replay
        id: replay
        run: python -m coverage run --append -m project_live.cli replay data/synthetic_example.jsonl
      - name: Report coverage gaps even after test failures
        id: coverage
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          python -m coverage report > coverage.txt
          cat coverage.txt
      - name: Prove gates reject synthetic violations
        id: negative
        run: python tools/check_negative_controls.py
      - name: Audit pinned tool dependencies and vulnerable synthetic control
        id: audit
        run: |
          python -m pip_audit --no-deps --disable-pip -r requirements/ci.txt --format json -o audit.json
          python tools/ci_summary.py --check-audit
          python tools/check_negative_controls.py --audit-only
      - name: Whitespace in PR or push changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Evidence and unverified claims
        if: ${{ always() }}
        env:
          RESULT_INSTALL: ${{ steps.install.outcome }}
          RESULT_LINT: ${{ steps.lint.outcome }}
          RESULT_FORMAT: ${{ steps.format.outcome }}
          RESULT_ACTIONS: ${{ steps.actions.outcome }}
          RESULT_DOCS: ${{ steps.docs.outcome }}
          RESULT_TESTS: ${{ steps.tests.outcome }}
          RESULT_REPLAY: ${{ steps.replay.outcome }}
          RESULT_COVERAGE: ${{ steps.coverage.outcome }}
          RESULT_NEGATIVE: ${{ steps.negative.outcome }}
          RESULT_AUDIT: ${{ steps.audit.outcome }}
          RESULT_DIFF: ${{ steps.diff.outcome }}
        run: python tools/ci_summary.py
